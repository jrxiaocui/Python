# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml
parameters:
  - name: environment
    type: string
    default: 'dev'
    values:
      - dev
      - prod

trigger:
 branches:
  include:
  - dev-1
  - master

pr: none

pool:
  vmImage: ubuntu-latest

stages:
- stage: map_branch_with_env
  jobs:
  - job: map_branch_with_env
    steps:
    - checkout: none
    - script: |
         branch=$(echo $(Build.SourceBranch) | sed 's|refs/heads/||')
         if [[ $branch == 'dev-1' ]]; then
          echo "##vso[task.setvariable variable=environment]dev"
         elif [[ $branch == 'master' ]]; then
          echo "##vso[task.setvariable variable=environment]prod"
         fi

- stage: deploy_dev
  displayName: deploy_dev
  condition: eq('${{ parameters.environment }}', 'dev')
  jobs:
    - job: deploy_dev
      steps:
      - script: |
          echo "deploy to dev env"

- stage: deploy_prod
  displayName: deploy_prod
  condition: eq('${{ parameters.environment }}', 'prod')
  jobs:
    - job: deploy_prod
      steps:
      - script: |
          echo "deploy to prod env"
      
      

